name: Deploy to Firebase Hosting
on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    # Pinned image: ubuntu-latest moves between Ubuntu versions (and queued for us during the 26 rollout).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npx tsc --noEmit

      # No Twitch access token here on purpose: anything in a VITE_ variable ends up
      # in the public JavaScript. Each user logs in with their own Twitch account.
      - name: Build Project
        run: npm run build
        env:
          VITE_TWITCH_CLIENT_ID: ${{ secrets.VITE_TWITCH_CLIENT_ID }}
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}

      # Same deploy action as before, but pinned to a commit (firebase-tools v15.34.1)
      # instead of @master, so upstream changes can't run with our service-account key.
      - name: Deploy Hosting
        uses: w9jds/firebase-action@a3f8db378f69597e99644eb9c8dfefe0bcce6e1d
        with:
          args: deploy --only hosting

      # Database rules deploy separately, so a permissions problem here can't block a hosting release.
      # The service account needs the "Firebase Realtime Database Admin" role.
      - name: Deploy Database Rules
        uses: w9jds/firebase-action@a3f8db378f69597e99644eb9c8dfefe0bcce6e1d
        with:
          args: deploy --only database
